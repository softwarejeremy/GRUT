<body class="page-buses">

    <header class="navbar">
        <div class="logo">
            <img src="imagenes/logotipo-512.png" alt="Logotipo de la empresa de transporte">
            <h1>GRUT</h1>
        </div>
        <nav class="navlinks" aria-label="Navegación principal">

    <main id="contenido" tabindex="-1">

                <button class="btn-remove">- Borrar bus</button>
            </div>

            <div class="table-container" role="region" aria-label="Tabla de buses" tabindex="0">

                <thead>

                        <th>Placa</th>
                        <th>Capacidad</th>
                        <th>Estado</th>

                </thead>
                <tbody>
                    <tr>

                    </tr>
                    <tr>
                        <td><input type="text" value="DEF-456"><button class="edit-btn">✏️</button></td>

                        <td><input type="text" value="Activo"><button class="edit-btn">✏️</button></td>
                    </tr>
                    <tr>
                        <td><input type="text" value="GHI-789"><button class="edit-btn">✏️</button></td>
                        <td><input type="text" value="42"><button class="edit-btn">✏️</button></td>
                        <td><input type="text" value="Activo"><button class="edit-btn">✏️</button></td>
                    </tr>
                </tbody>
            </table>
            </div>
        </section>
    </main>

    <footer>
        <h2>IG: @GRUT_updates</h2>
        <h2>FB: @GRUT_updates</h2>
